# Paste your runtime keys here, then run:
#   ./scripts/apply_cloudrun_env.sh
#
# These variables are applied to Cloud Run service tox-agent-cpu by default.
# Optional. Leave empty to use Vertex AI ADC via Cloud Run service account.
GOOGLE_API_KEY: ""
PUBMED_API_KEY: ""
# Optional model overrides. Keep defaults unless you need different models.
AGENT_MODEL_FAST: "gemini-2.5-flash"
AGENT_MODEL_PRO: "gemini-2.5-pro"
GEMINI_MODEL: "gemini-2.5-flash"
# Default path: Vertex AI billing via service-account auth (ADC).
# Ensure the Cloud Run service account has roles/aiplatform.user.
GOOGLE_GENAI_USE_VERTEXAI: "true"
GOOGLE_CLOUD_PROJECT: "tox-agent"
GOOGLE_CLOUD_LOCATION: "global"
GEMINI_LOCATION: "global"
AGENT_APP_NAME: "tox-agent"
TOX_AGENT_ANALYZE_RUNTIME: "deterministic"
MODELS_ROOT: "/app/models"
MODEL_ARTIFACTS_URI: "gs://tox-agent-models/models"
MODEL_SERVER_TIMEOUT: "240"
# When agent and model endpoints run in the same Cloud Run container,
# route model-server calls over localhost to avoid self-HTTP loops via
# the public service URL, extra instance spin-up, and 600s request stalls.
MODEL_SERVER_URL: "http://127.0.0.1:8080"
DEFAULT_INFERENCE_BACKEND: "chemberta"
# Database thật đang tồn tại trong project tox-agent là (default)
FIRESTORE_DATABASE_ID: "(default)"
# LLM feature flags for orchestrator pipeline.
# Set to "0" to disable (deterministic fallback) or "1" to enable LLM synthesis/recommendations.
RESEARCH_ENABLE_LLM_SYNTHESIS: "1"
WRITER_ENABLE_LLM_RECOMMENDATIONS: "1"