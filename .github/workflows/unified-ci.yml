name: Unified quality gates

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  fast-pr:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -e './backend/predictor[dev]' -e './backend/control[dev]'
      - run: python backend/predictor/scripts/check_no_agent_deps.py
      - run: python -m pytest -q backend/predictor/tests/unit backend/predictor/tests/contract backend/control/tests/unit backend/control/tests/contract
      - run: git diff --exit-code -- backend/predictor/evals/benchmark/manifests backend/control/src/toxagent/predictor/contract_snapshot.json

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install build
      - run: cd backend/predictor && python -m build --wheel
      - run: python -m venv /tmp/toxpred-clean
      - run: /tmp/toxpred-clean/bin/pip install backend/predictor/dist/toxpred-*.whl
      - run: cd /tmp && /tmp/toxpred-clean/bin/python -c "import toxpred; print('import OK')"

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/predictor/deploy/Dockerfile -t toxpred-ci .
      - run: docker image inspect toxpred-ci --format '{{.Size}}'
      - run: docker run --rm --network=none --entrypoint python toxpred-ci -c "import toxpred; print('import OK')"

  scientific-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e './backend/predictor[dev]' -c backend/predictor/research/constraints/py310.txt
      - run: python -m pytest -q -m golden backend/predictor/tests/golden
      - run: PYTHONPATH=backend/predictor python backend/predictor/evals/benchmark/run_benchmark.py --help

  runtime-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e './backend/control[dev]'
      - run: cd backend/control && python -m pytest -q tests/e2e/test_scripted_runtime.py tests/unit/test_runtime_recovery.py tests/unit/test_opencode_surface_assertion.py
      - name: Credentialed OpenCode matrix
        if: env.TOXAGENT_LIVE_RUNTIME == '1'
        run: cd backend/control && python -m evals.runner --runtime opencode --trials 3
        env:
          TOXAGENT_LIVE_RUNTIME: ${{ secrets.TOXAGENT_LIVE_RUNTIME }}
