name: Unified quality gates

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  fast-pr:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -e '.[dev]' -e './backend/control[dev]'
      - run: python scripts/check_no_agent_deps.py
      - run: python -m pytest -q tests/unit tests/contract backend/control/tests/unit backend/control/tests/contract
      - run: git diff --exit-code -- benchmarks/manifests backend/control/src/toxagent/predictor/contract_snapshot.json

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install build
      - run: python -m build --wheel
      - run: python -m venv /tmp/toxpred-clean
      - run: /tmp/toxpred-clean/bin/pip install dist/toxpred-*.whl
      - run: cd /tmp && HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 /tmp/toxpred-clean/bin/python -c "from pathlib import Path; from toxpred.scientific.bootstrap import build_registry; from toxpred.application.predictor import ToxicityPredictor; r=build_registry(Path('${{ github.workspace }}/artifacts/predictor-manifest.yaml')); print(ToxicityPredictor(r).predict('CCO', ['herg']).herg.probability_blocker)"

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t toxpred-ci .
      - run: docker image inspect toxpred-ci --format '{{.Size}}'
      - run: docker run --rm --network=none --entrypoint python toxpred-ci -c "from toxpred.scientific.bootstrap import build_registry; print(build_registry().describe_capabilities())"

  scientific-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e '.[dev,benchmark,xai]' -c constraints/py310.txt
      - run: python -m pytest -q -m golden
      - run: python benchmarks/run_benchmark.py --help

  runtime-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e './backend/control[dev]'
      - run: cd backend/control && python -m pytest -q tests/e2e/test_scripted_runtime.py tests/unit/test_runtime_recovery.py tests/unit/test_opencode_surface_assertion.py
      - name: Credentialed OpenCode matrix
        if: env.TOXAGENT_LIVE_RUNTIME == '1'
        run: cd backend/control && python -m evals.runner --runtime opencode --trials 3
        env:
          TOXAGENT_LIVE_RUNTIME: ${{ secrets.TOXAGENT_LIVE_RUNTIME }}
