[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toxpred"
version = "0.1.0.dev0"
description = "Headless toxicity prediction service: hERG blockade and Tox21 assay activity."
requires-python = ">=3.10"
# The one declaration of this service's dependencies. requirements.lock pins
# the full resolved set (`make lock`); the image installs from it, with torch
# installed first from the PyTorch index for the chosen TORCH_VARIANT.
#
# Deliberately absent, and why:
#   deepchem, pytdc        dataset loaders; only the split builder (`split` extra)
#   matplotlib, pillow     the API returns numbers, never a rendered image
#   google-adk, google-genai, firebase-admin, sentence-transformers
#                          the agent layer this service replaced
#   molscribe, opencv, timm, albumentations, SmilesPE
#                          image-to-SMILES OCR, not part of prediction
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "numpy",
    "pyyaml",
    "rdkit",
    # The version deploy/Dockerfile installs (for its TORCH_VARIANT).
    "torch==2.6.0",
    # Pinned: the served tokenizer's output is part of golden parity.
    "transformers==4.56.2",
]

[project.optional-dependencies]
benchmark = ["scikit-learn", "pandas"]
xai = ["captum>=0.7"]
clintox = ["torch-geometric>=2.6"]
full = ["captum>=0.7", "torch-geometric>=2.6", "scikit-learn", "pandas"]
dev = ["pytest>=8", "httpx", "ruff==0.13.3", "mypy>=1.11"]
# Only to regenerate the frozen evaluation split (research/benchmark/build_split_manifest.py).
split = ["deepchem", "pytdc", "pandas", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["toxpred*"]

# Report-only for now (`make typecheck`); flip to blocking once the baseline is
# clean. Lint rules live in the repository-wide ruff.toml.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/golden"]
pythonpath = ["src"]
# See backend/control/pyproject.toml: an empty parameter set is a test that
# asserted nothing, not a legitimate skip.
empty_parameter_set_mark = "fail_at_collect"
markers = ["golden: regression against captured model outputs; needs real artifacts"]
