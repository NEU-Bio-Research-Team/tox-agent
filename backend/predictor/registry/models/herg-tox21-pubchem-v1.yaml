# The dual-head architecture on a different backbone: a RoBERTa pretrained on
# 10M PubChem SMILES with a BPE tokenizer. Same training recipe as
# herg-tox21-chemberta-v1 (30 + 15 epochs). On the training run's own held-out
# split it is level on hERG (AUROC 0.841 against 0.837) and lower on Tox21
# (macro AUROC 0.731 against 0.760). Those numbers come from the training
# run's metrics file, not from this repository's benchmark, which has not been
# run on this release. Optional and never the default.
#
# The checkpoint carries every backbone weight; base_model/config.json is the
# architecture only, vendored from the pinned revision so the service starts
# without reaching Hugging Face.
schema_version: 1
models:
  - model_id: herg-tox21-pubchem-v1
    display_name: PubChem RoBERTa hERG / Tox21 v1
    provider: herg_tox21_chemberta
    capabilities: [herg, tox21]
    artifact_dir: pretrained_2head_herg_pubchem_model
    required: false
    notes: >-
      PubChem-pretrained RoBERTa backbone, dual-head. Held-out test from the training run:
      hERG AUROC 0.841, Tox21 macro AUROC 0.731. Not yet run through this repository's benchmark.
    feature_schema_version: pubchem-bpe-smiles-v1
    base_model:
      id: seyonec/PubChem10M_SMILES_BPE_450k
      revision: c18fccd09b3326bf2d4633412c256d7db872156d
      weights_source: checkpoint
