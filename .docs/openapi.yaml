openapi: 3.1.0
info:
  title: Readiness Control API
  version: 1.0.0
  description: >
    Reference API for registering internal services and recording production-readiness checks.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Platform
  - name: Services
paths:
  /health:
    get:
      tags: [Platform]
      summary: Service liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Platform]
      summary: Service readiness probe
      operationId: getReady
      responses:
        "200":
          description: Service is ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /metrics:
    get:
      tags: [Platform]
      summary: Prometheus-style metrics
      operationId: getMetrics
      responses:
        "200":
          description: Plain-text metrics payload
          content:
            text/plain:
              schema:
                type: string
  /v1/services:
    get:
      tags: [Services]
      summary: List registered services
      operationId: listServices
      responses:
        "200":
          description: Collection of services
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceWithChecks"
                required: [data]
    post:
      tags: [Services]
      summary: Register a service
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Service"
                required: [data]
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/services/{serviceId}:
    get:
      tags: [Services]
      summary: Get a single service
      operationId: getService
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Service found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ServiceWithChecks"
                required: [data]
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/services/{serviceId}/checks:
    get:
      tags: [Services]
      summary: List readiness checks for a service
      operationId: listChecks
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Checks for the service
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReadinessCheck"
                required: [data]
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Services]
      summary: Add a readiness check for a service
      operationId: createCheck
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckRequest"
      responses:
        "201":
          description: Check created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReadinessCheck"
                required: [data]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: readiness-control-api
        version:
          type: string
          example: 1.0.0
        uptimeSeconds:
          type: integer
          example: 42
        timestamp:
          type: string
          format: date-time
      required: [status, service, version, uptimeSeconds, timestamp]
    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: ready
        checks:
          type: object
          properties:
            configLoaded:
              type: boolean
            storeReachable:
              type: boolean
          required: [configLoaded, storeReachable]
      required: [status, checks]
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner:
          type: string
        tier:
          type: string
          example: tier-1
        description:
          type: string
        lifecycle:
          type: string
          example: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, owner, tier, description, lifecycle, createdAt, updatedAt]
    ServiceWithChecks:
      allOf:
        - $ref: "#/components/schemas/Service"
        - type: object
          properties:
            checks:
              type: array
              items:
                $ref: "#/components/schemas/ReadinessCheck"
          required: [checks]
    ReadinessCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        category:
          type: string
          example: security
        status:
          type: string
          enum: [pass, warn, fail]
        summary:
          type: string
        evidenceUrl:
          type: string
        checkedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, serviceId, category, status, summary, evidenceUrl, checkedAt, createdAt]
    CreateServiceRequest:
      type: object
      properties:
        name:
          type: string
        owner:
          type: string
        tier:
          type: string
        description:
          type: string
        lifecycle:
          type: string
      required: [name, owner, tier]
    CreateCheckRequest:
      type: object
      properties:
        category:
          type: string
        status:
          type: string
          enum: [pass, warn, fail]
        summary:
          type: string
        evidenceUrl:
          type: string
        checkedAt:
          type: string
          format: date-time
      required: [category, status, summary]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
