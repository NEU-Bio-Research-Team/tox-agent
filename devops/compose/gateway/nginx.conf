# The one door into the stack from outside this machine.
#
# A tunnel forwards a public HTTPS hostname to this server, and this server
# forwards two things: the product API under /v1/ and the two health probes.
# Everything else answers 404 here and never reaches the control plane: the
# runtime's tool plane (/internal/mcp), /metrics, the interactive API docs.
# Those are for processes inside the stack, and a tunnel pointed straight at
# the control plane would publish all of them.
server {
    listen 8080;
    server_name _;
    # Docker's embedded DNS, resolved per request so the gateway starts
    # whether or not the control plane is up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $control_plane toxagent-control;

    # A structure image may be 5 MB and travels base64-encoded in JSON.
    client_max_body_size 10m;

    location ^~ /v1/ {
        proxy_pass http://$control_plane:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Session events are a server-sent stream. Buffered, they would reach
        # the browser in one piece when the run ends; with the default read
        # timeout, a quiet minute would cut the stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health/live {
        proxy_pass http://$control_plane:8000;
        proxy_http_version 1.1;
    }

    location = /health/ready {
        proxy_pass http://$control_plane:8000;
        proxy_http_version 1.1;
    }

    location = /gateway-healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
