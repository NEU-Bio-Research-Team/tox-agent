# One lint configuration for every Python service (backend/control,
# backend/predictor, backend/ocr, devops). A per-service [tool.ruff] table would
# let the three drift apart; backend/ocr has no pyproject.toml to hold one.
#
#   make lint          ruff check, the blocking rules below
#   make lint-report   the wider rule set, report only
#
# Formatting (`ruff format`) is configured but not enforced: reformatting ~540
# files would bury every structural move in the review diff. Turn it on per
# service once the moves in docs/spec/WORKSPACE_STRUCTURE_REVIEW.md are done.

target-version = "py310"
line-length = 100
extend-exclude = [
    ".venv-test",
    "backend/predictor/research",   # offline research code, its own environment
    "**/migrations/versions",        # generated by alembic, kept as generated
]

[lint]
# Pyflakes (real defects: unused/undefined names), the syntax-level pycodestyle
# errors, and bugbear. Style rules (import order, pyupgrade) are in
# `make lint-report` until the tree is clean enough to block on them.
select = ["F", "E4", "E7", "E9", "B"]
ignore = [
    "B008",  # FastAPI's `Depends(...)` / `Query(...)` defaults are the framework idiom
    "E741",  # `l` / `I` as names: noisy in scientific code, not a defect
    "B905",  # `zip(strict=)`: adding it changes behaviour; decide per call, not by lint
]

[lint.per-file-ignores]
# Tests assert on broad exceptions deliberately (a refusal is the behaviour).
"**/tests/**" = ["B017"]
# Scripts put sys.path setup before their imports on purpose.
"**/scripts/**" = ["E402"]
"backend/predictor/evals/**" = ["E402"]
# Frozen research-era evaluation scripts (P1 in the structure review): kept
# byte-for-byte as they produced published numbers, so unused results stay.
"backend/predictor/evals/scripts/**" = ["E402", "F401", "F541", "F841"]

[format]
quote-style = "preserve"
