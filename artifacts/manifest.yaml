        bytes: 430
      - path: tox21_task_thresholds.json
        sha256: cc1bbe37a8eb617382c2e276ad34352829418df4b17e28003903731ef9b88386
        bytes: 4026
      - path: tokenizer/tokenizer.json
        sha256: ba6a21b7958b8aebf1f3ac341a883c430ae9906cba797b4f186ac79dcd00d785
        bytes: 14028
      - path: tokenizer/tokenizer_config.json
        sha256: 546a1c6da0c2a47e67d8ef88d7181bb05d617228ebccb955fb6e269dbd1e4d44
