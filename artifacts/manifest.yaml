# ToxAgent predictor artifact manifest.
#
# The registry loads only what is declared here, and only after every file's
# SHA-256 matches. A directory that merely exists is not an artifact.
#
# Regenerate checksums with:  python benchmarks/capture_baseline.py
schema_version: 1
models_root: ../models

models:
  - model_id: herg-tox21-chemberta-v1
    provider: herg_tox21_chemberta
    capabilities: [herg, tox21]
    artifact_dir: pretrained_2head_herg_chemberta_model
    required: true
    feature_schema_version: chemberta-smiles-v1
    base_model:
      id: DeepChem/ChemBERTa-77M-MTR
      revision: null   # UNPINNED — see docs/refactor/PREDICTOR_ONLY_STATUS_VI.md
      weights_source: checkpoint
      note: >-
        The checkpoint carries the full backbone state dict (61 tensors including
        backbone.embeddings.* and backbone.pooler.*), so the Hugging Face repo is
        needed only for the architecture config, not for weights. Pinning the
        revision and vendoring that config removes the last network dependency.
    files:
      - path: best_model.pt
        sha256: c851e81541f8975f66589879ba9bd35c3068c3fbd57417bb7939214183f62690
        bytes: 14050530
      - path: config.yaml
        sha256: d747c3a2c7eda504eccc7b1e2daa5ce2b40d5f342e0195ad1080544424241b7d
        bytes: 2013
