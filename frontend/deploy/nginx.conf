server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Docker's embedded DNS. Using a variable defers resolution until a
    # request, so `nginx -t` and a standalone static frontend still work.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $control_plane toxagent-control;

    # A hashed asset never changes content under the same URL; index.html
    # does, and must always be revalidated or a deploy silently never reaches
    # a browser with a stale tab open.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Keep browser calls same-origin in the deployed topology. This is part of
    # the frontend contract, not an optional ingress detail: without it /v1
    # falls through to index.html and the client receives a misleading 404.
    location ^~ /v1/ {
        proxy_pass http://$control_plane:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /health/ {
        proxy_pass http://$control_plane:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
